name: daily-anchor
# Once a day: the Merkle root of receipts/ledger.jsonl and every signed dossier's hash go to EAS,
# from a dedicated anchor wallet (TAKAR_ANCHOR_KEY, a little test ETH, nothing else).
on:
  schedule: [{ cron: "23 3 * * *" }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  anchor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node scripts/anchor.mjs --send
        env:
          TAKAR_ANCHOR_KEY: ${{ secrets.TAKAR_ANCHOR_KEY }}
      - run: |
          git config user.name "takar-anchor"
          git config user.email "takar-anchor@users.noreply.github.com"
          git add receipts/anchors.jsonl
          git commit -m "daily anchor" || exit 0
          git pull --rebase && git push
