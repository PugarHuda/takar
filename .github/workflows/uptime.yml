name: miner-uptime
# Hourly availability and latency of the Takar Outcome miner from outside, on questions answered
# from data (no model, no cost). Evidence for reliability, not a load test.
on:
  schedule: [{ cron: "41 * * * *" }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/uptime.mjs
      - run: |
          git config user.name "takar-snapshot"
          git config user.email "takar-snapshot@users.noreply.github.com"
          git add receipts/uptime.jsonl
          git commit -m "uptime probe" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
