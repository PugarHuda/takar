name: publish-mcp
# Publishes takar-mcp from mcp/ to npm with npm Trusted Publishing (OIDC): no npm token is stored anywhere.
# One-time setup on npmjs.com: package takar-mcp -> Settings -> Trusted Publisher -> GitHub Actions,
# user PugarHuda, repository takar, workflow publish-mcp.yml.
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, registry-url: "https://registry.npmjs.org" }
      - run: npm install -g npm@latest # trusted publishing needs npm 11.5 or newer
      - run: node test.mjs --offline
      - run: npm publish --provenance --access public
