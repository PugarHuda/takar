name: served-snapshot
# The node's request counter per miner, every two hours, so "scored 0 with no reason" can be
# checked against "did any request reach this miner in that window" (api/miner.js).
on:
  schedule: [{ cron: "17 */2 * * *" }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/snapshot-served.mjs
      - run: node scripts/snapshot-questions.mjs
      - run: |
          git config user.name "takar-snapshot"
          git config user.email "takar-snapshot@users.noreply.github.com"
          git add receipts/served.jsonl receipts/questions.jsonl
          git commit -m "served snapshot" || exit 0
          git pull --rebase && git push
