<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Takar social card</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Semi+Condensed:wght@600;800&display=swap" rel="stylesheet">
<style>
/* Rendered once at 1200x630 into media/og.png, the link preview for takar-telegraph.vercel.app. */
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #EEF1EF; color: #17222B; font-family: "Atkinson Hyperlegible", sans-serif; }
.top { height: 400px; padding: 56px 72px 0; box-sizing: border-box; position: relative; }
.brand { display: flex; align-items: center; gap: 14px; font: 800 2.1rem "Barlow Semi Condensed", sans-serif; }
.brand svg { width: 44px; height: 44px; }
h1 { font: 800 7.2rem/.9 "Barlow Semi Condensed", sans-serif; letter-spacing: -.02em; margin: 38px 0 0; }
.band { height: 230px; background: #C9962B; padding: 30px 72px; box-sizing: border-box; display: flex; gap: 14px; align-items: stretch; }
.stage { flex: 1; background: #17222B; color: #EEF1EF; border-radius: 12px; padding: 18px 16px; display: flex; flex-direction: column; gap: 6px; }
.stage b { color: #C9962B; font: 700 1.2rem "Barlow Semi Condensed", sans-serif; }
.stage span { font: 700 1.6rem/1.05 "Barlow Semi Condensed", sans-serif; }
.stage.last { background: transparent; color: #17222B; border: 3px solid #17222B; }
.stage.last b { color: #17222B; }
</style>
</head>
<body>
  <div class="top">
    <div class="brand"><svg viewBox="0 0 26 26"><rect width="26" height="26" rx="6" fill="#17222B"/><rect x="4" y="16" width="18" height="4" rx="1" fill="#C9962B"/><rect x="11.5" y="5" width="3" height="11" fill="#EEF1EF"/></svg>Takar</div>
    <h1>Can I act on<br>this answer?</h1>
  </div>
  <div class="band">
    <div class="stage"><b>1</b><span>Two operators asked</span></div>
    <div class="stage"><b>2</b><span>Compared field by field</span></div>
    <div class="stage"><b>3</b><span>Recorded on chain</span></div>
    <div class="stage last"><b>4</b><span>Paid only when they agree</span></div>
  </div>
</body>
</html>
